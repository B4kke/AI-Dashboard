name: OpenCode V2 SDK introspection

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - .github/workflows/opencode-v2-sdk-introspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect published @opencode/client@2.0.24
        run: |
          node --input-type=module <<'NODE'
          import { OpenCode } from '@opencode/client';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('node_modules/@opencode/client/package.json', 'utf8'));
          const client = OpenCode.make({ baseUrl: 'http://127.0.0.1:9' });
          console.log('package', pkg.name, pkg.version);
          console.log('session keys', Object.keys(client.session).sort());
          console.log('session.log typeof', typeof client.session?.log);
          console.log('event.subscribe typeof', typeof client.event?.subscribe);
          console.log('exports', pkg.exports || null);
          NODE
          grep -R --line-number --fixed-string 'session.log' node_modules/@opencode/client | head -20 || true
          grep -R --line-number --fixed-string '/api/experimental/session/' node_modules/@opencode/client | head -20 || true
