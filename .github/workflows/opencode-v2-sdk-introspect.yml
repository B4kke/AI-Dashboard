name: OpenCode V2 durable-log fixture audit

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - .github/workflows/opencode-v2-sdk-introspect.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inventory stale terminal-evidence fixtures
        shell: bash
        run: |
          echo '--- idle/outcome fixtures ---'
          grep -R --line-number -E "type: ['\"]idle['\"]|outcome: ['\"](succeeded|failed|interrupted)['\"]|idle\.outcome" test README.md AGENTS.md docs server || true
          echo '--- sessionEvidence fixtures without durable log markers ---'
          grep -R --line-number 'sessionEvidence' test | head -200 || true
      - name: Syntax
        shell: bash
        run: |
          node --check server/integrations/opencode.mjs
          node --check server/core/runner-session-status.mjs
          node --check server/core/control-guards.mjs
          node --check server/orchestrator.mjs
      - name: Full tests
        run: npm test
