name: OpenCode V2 SDK introspection

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - .github/workflows/opencode-v2-sdk-introspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect exact @opencode/client@2.0.24 inbox item identity
        run: |
          TYPES=node_modules/@opencode/client/dist/promise/generated/types.d.ts
          sed -n '3138,3238p' "$TYPES"
          echo '--- prompt input ---'
          sed -n '6060,6128p' "$TYPES"
