name: OpenCode V2 one-shot foundation sync

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - .github/workflows/opencode-v2-sync-foundation.yml

permissions:
  contents: write

jobs:
  sync-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/opencode-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Merge pinned canonical foundation and resolve only proven conflicts
        shell: bash
        run: |
          set -euo pipefail
          readonly EXPECTED_BASE='55fa29c68538d7159f8d88860e82bc29a159a52a'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin bootstrap/control-center-foundation
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"

          set +e
          git merge --no-ff --no-commit "$EXPECTED_BASE"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts
            cat > /tmp/expected-conflicts <<'EOF'
          README.md
          docs/06-sdk-integrations.md
          package-lock.json
          package.json
          EOF
            sort -o /tmp/expected-conflicts /tmp/expected-conflicts
            diff -u /tmp/expected-conflicts /tmp/actual-conflicts

            git checkout --ours README.md docs/06-sdk-integrations.md package.json package-lock.json

            node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          pkg.dependencies['@modelcontextprotocol/client'] = '2.3.1';
          pkg.dependencies['@modelcontextprotocol/node'] = '2.1.1';
          pkg.dependencies['@modelcontextprotocol/server'] = '2.3.1';
          if (pkg.dependencies['@opencode/client'] !== '2.0.24') throw new Error('OpenCode V2 dependency drifted during merge');
          if (pkg.dependencies['@opencode-ai/sdk']) throw new Error('V1 OpenCode SDK reappeared during merge');
          await writeFile('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          for (const path of ['README.md', 'docs/06-sdk-integrations.md']) {
            let text = await readFile(path, 'utf8');
            text = text.replaceAll('@modelcontextprotocol/server  2.0.0', '@modelcontextprotocol/server  2.3.1');
            text = text.replaceAll('@modelcontextprotocol/client  2.0.0', '@modelcontextprotocol/client  2.3.1');
            text = text.replaceAll('@modelcontextprotocol/node    2.0.0', '@modelcontextprotocol/node    2.1.1');
            text = text.replaceAll('`@modelcontextprotocol/server@2.0.0`', '`@modelcontextprotocol/server@2.3.1`');
            text = text.replaceAll('`@modelcontextprotocol/client@2.0.0`', '`@modelcontextprotocol/client@2.3.1`');
            text = text.replaceAll('`@modelcontextprotocol/node@2.0.0`', '`@modelcontextprotocol/node@2.1.1`');
            await writeFile(path, text);
          }
          NODE

            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git add README.md docs/06-sdk-integrations.md package.json package-lock.json
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(node -p "require('./package.json').dependencies['@opencode/client']")" = '2.0.24'
          test "$(node -p "require('./package.json').dependencies['@modelcontextprotocol/server']")" = '2.3.1'
          test "$(node -p "require('./package.json').dependencies['@modelcontextprotocol/client']")" = '2.3.1'
          test "$(node -p "require('./package.json').dependencies['@modelcontextprotocol/node']")" = '2.1.1'
          git diff --cached --check
          git commit -m 'merge: sync current foundation into OpenCode V2 migration'
          git push origin HEAD:feat/opencode-v2-migration
