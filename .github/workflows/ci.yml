name: CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check server/index.mjs
          node --check server/core/autonomy-engine.mjs
          node --check public/app.js

      - name: Tests
        run: npm test
