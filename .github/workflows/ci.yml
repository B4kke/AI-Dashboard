name: CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax checks
        run: |
          find server test scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tests
        run: npm test

      - name: Rendered React UI smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ui-smoke
          npm start > .tmp/ui-smoke/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          let lastError = null;
          for (let attempt = 0; attempt < 80; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:7331/api/health');
              if (response.ok) process.exit(0);
              lastError = new Error(`health HTTP ${response.status}`);
            } catch (error) { lastError = error; }
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
          throw lastError || new Error('Dashboard did not become healthy');
          NODE

          # First-run is a P0 product surface and must render before any setup state is seeded.
          for SIZE in 1440x1000 768x1000 390x844; do
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" 'http://127.0.0.1:7331/#/master' "setup-${SIZE}" '.setup-card'
          done

          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:7331/api/setup/complete', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ locale: 'nb' }),
          });
          if (!response.ok) throw new Error(`Setup fixture failed: HTTP ${response.status} ${await response.text()}`);
          NODE

          PROJECT_ID="$(node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:7331/api/projects', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name: 'Rendered UI Smoke', description: 'React Project workspace rendering fixture' }),
          });
          if (!response.ok) throw new Error(`Project fixture creation failed: HTTP ${response.status} ${await response.text()}`);
          const project = await response.json();
          if (!project?.id) throw new Error('Project fixture response is missing id');
          console.log(project.id);
          NODE
          )"

          PROJECT_ID="$PROJECT_ID" node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:7331/api/tasks', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              projectId: process.env.PROJECT_ID,
              title: 'Rendered operator Task',
              description: 'Task fixture for mobile navigation rendering.',
              acceptanceCriteria: ['The React operator surface renders without runtime errors.'],
              priority: 'P1',
            }),
          });
          if (!response.ok) throw new Error(`Task fixture creation failed: HTTP ${response.status} ${await response.text()}`);
          NODE

          MASTER_CONVERSATION_ID="$(PROJECT_ID="$PROJECT_ID" node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:7331';
          const conversationResponse = await fetch(`${base}/api/master/conversations`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ projectId: process.env.PROJECT_ID, title: 'Rendered Master conversation' }),
          });
          if (!conversationResponse.ok) throw new Error(`Master fixture creation failed: HTTP ${conversationResponse.status} ${await conversationResponse.text()}`);
          const conversation = await conversationResponse.json();
          const messageResponse = await fetch(`${base}/api/master/conversations/${conversation.id}/messages`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ content: 'CI render fixture; no model call is faked here.' }),
          });
          if (!messageResponse.ok) throw new Error(`Master message fixture failed: HTTP ${messageResponse.status} ${await messageResponse.text()}`);
          console.log(conversation.id);
          NODE
          )"

          for SIZE in 1440x1000 768x1000 390x844; do
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" 'http://127.0.0.1:7331/#/projects' "projects-${SIZE}" '.project-card'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" 'http://127.0.0.1:7331/#/explorations' "explorations-${SIZE}" '.exploration-list'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/overview" "project-overview-${SIZE}" '.status-grid'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/tasks" "project-tasks-${SIZE}" '.operator-list'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/agents" "project-agents-${SIZE}" '.workspace-section'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/master/${MASTER_CONVERSATION_ID}" "project-master-${SIZE}" '.message-user'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/github" "project-github-${SIZE}" '.workspace-section'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/evidence" "project-evidence-${SIZE}" '.workspace-section'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/research" "project-research-${SIZE}" '.workspace-section'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" "http://127.0.0.1:7331/#/project/${PROJECT_ID}/settings" "project-settings-${SIZE}" '.role-model-grid'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" 'http://127.0.0.1:7331/#/master' "master-${SIZE}" '.master-empty'
            node scripts/screenshot.mjs .tmp/ui-smoke "$SIZE" 'http://127.0.0.1:7331/#/system' "system-${SIZE}" '.integration-list'
          done

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ github.sha }}
          path: |
            .tmp/ui-smoke/*.png
            .tmp/ui-smoke/server.log
          if-no-files-found: warn
          retention-days: 7

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tests
        run: npm test
