name: CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Syntax checks
        run: |
          find server test -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check public/app.js

      - name: Tests
        run: npm test
