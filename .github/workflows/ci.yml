name: CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit generated dependency lock once
        if: github.event_name == 'push' && github.ref_name == 'bootstrap/control-center-foundation'
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already tracked'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock runtime SDK dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Syntax checks
        run: |
          find server test scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tests
        run: npm test

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Tests
        run: npm test
