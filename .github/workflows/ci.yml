name: CI

on:
  push:
    branches:
      - main
      - bootstrap/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: sdk-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Syntax checks
        run: |
          find server test scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tests
        run: npm test

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned SDK dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Tests
        run: npm test
