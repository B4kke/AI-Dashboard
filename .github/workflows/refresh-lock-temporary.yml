name: Temporary MCP documentation refresh

on:
  push:
    branches:
      - bootstrap/control-center-foundation
    paths:
      - .github/workflows/refresh-lock-temporary.yml

permissions:
  contents: write

jobs:
  refresh-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Align documented MCP pins with package.json
        shell: python
        run: |
          from pathlib import Path
          import re

          pins = {
              '@modelcontextprotocol/client': '2.3.1',
              '@modelcontextprotocol/server': '2.3.1',
              '@modelcontextprotocol/node': '2.1.1',
          }
          paths = [Path('README.md'), *Path('docs').glob('*.md')]
          changed = []
          for path in paths:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original
              for package, version in pins.items():
                  updated = re.sub(rf'({re.escape(package)}(?:@|\s+|`:\s*`))2\.0\.0', rf'\g<1>{version}', updated)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
      - name: Commit documentation if changed
        run: |
          if git diff --quiet -- README.md docs; then
            echo "Documentation already matches package pins"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "docs: align MCP SDK security pins"
          git push origin "HEAD:${GITHUB_REF_NAME}"
