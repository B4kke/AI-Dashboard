name: P0 Master product repair runner

on:
  push:
    branches:
      - bootstrap/control-center-foundation
    paths:
      - scripts/p0-master-product-repair.py
      - .github/workflows/p0-lock-and-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/control-center-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Product Foundation repair
        run: python scripts/p0-master-product-repair.py
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check server/index.mjs
          node --check server/http-server.mjs
          node --check server/master/service.mjs
          node --check server/master/memory.mjs
      - name: Build React frontend
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit verified Product Foundation repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "p0: finish Master memory and product foundation"
          git push origin HEAD:bootstrap/control-center-foundation
