name: P0 live repair runner

on:
  push:
    branches:
      - bootstrap/control-center-foundation
    paths:
      - scripts/p0-live-repair.py
      - .github/workflows/p0-lock-and-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/control-center-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic P0 repair
        run: |
          cp .github/workflows/ci.yml /tmp/ai-dashboard-ci.yml
          python scripts/p0-live-repair.py
          cp /tmp/ai-dashboard-ci.yml .github/workflows/ci.yml
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Build React frontend
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit verified repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "p0: wire setup, Master and plug-and-play Projects"
          git push origin HEAD:bootstrap/control-center-foundation
