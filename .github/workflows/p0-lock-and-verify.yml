          replace('web/src/i18n.ts', "usable: 'Klar til bruk', automation:", "usable: 'Klar til bruk', managed: 'Administrert', automation:")
          replace('web/src/i18n.ts', "usable: 'Ready to use', automation:", "usable: 'Ready to use', managed: 'Managed', automation:")

          # Final steady-state lock workflow; this migration workflow removes itself in the verified commit.
          Path('.github/workflows/p0-lock-and-verify.yml').write_text("""name: P0 dependency lock and verify

on:
  push:
    branches:
      - bootstrap/control-center-foundation
    paths:
      - package.json
      - web/**
      - server/**
      - test/**
      - .github/workflows/ci.yml
      - .github/workflows/p0-lock-and-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[p0-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/control-center-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Syntax and deterministic tests
        run: |
          node --check server/index.mjs
          node --check server/http-server.mjs
          npm test
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh P0 dependency lock [p0-lock]"
          git push origin HEAD:bootstrap/control-center-foundation
