name: OpenCode V2 migration helper

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - package.json
      - scripts/migrate-opencode-v2-orchestrator.mjs
      - .github/workflows/opencode-v2-lock.yml

permissions:
  contents: write

jobs:
  migrate-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/opencode-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply OpenCode V2 runtime transform
        run: |
          node scripts/migrate-opencode-v2-orchestrator.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'server/core/project-readiness.mjs';
          let text = await readFile(path, 'utf8');
          text = text.replace('const available = (Array.isArray(models) ? models : []).filter((model) => model?.available === true);', 'const availableModels = (Array.isArray(models) ? models : []).filter((model) => model?.available === true);');
          text = text.replaceAll('available.find((model) => model.id === requestedModel)', 'availableModels.find((model) => model.id === requestedModel)');
          text = text.replaceAll('available.filter((model) => model.default === true)', 'availableModels.filter((model) => model.default === true)');
          text = text.replaceAll('availableCount: available.length', 'availableCount: availableModels.length');
          await writeFile(path, text);
          NODE
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify migration invariants
        run: |
          node --check server/orchestrator.mjs
          node --check server/core/project-readiness.mjs
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          if (lock.packages?.['node_modules/@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in lockfile');
          if (lock.packages?.['node_modules/@opencode/client']?.version !== '2.0.24') throw new Error('pinned @opencode/client@2.0.24 missing from lockfile');
          NODE
      - name: Commit generated migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json server/orchestrator.mjs server/core/project-readiness.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(opencode): migrate orchestration to V2 evidence'
          git push origin HEAD:feat/opencode-v2-migration
