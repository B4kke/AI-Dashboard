name: OpenCode V2 validation helper

on:
  push:
    branches:
      - feat/opencode-v2-migration

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/opencode-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply one-shot V2 documentation finalizer
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/finalize-opencode-v2.mjs ]; then
            node scripts/finalize-opencode-v2.mjs
            rm scripts/finalize-opencode-v2.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md AGENTS.md docs/02-architecture.md docs/04-roadmap.md docs/06-sdk-integrations.md test/opencode-v2-contract.test.mjs scripts/finalize-opencode-v2.mjs
            git commit -m 'docs(opencode): align canonical V2 contracts'
            git push origin HEAD:feat/opencode-v2-migration
          fi
      - name: Verify lockfile is stable
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp /tmp/package-lock.before package-lock.json
      - name: Verify and test V2 branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check server/integrations/opencode.mjs
          node --check server/orchestrator.mjs
          node --check server/core/opencode-dispatch-safety.mjs
          node --check server/core/runner-session-status.mjs
          node --check server/core/project-readiness.mjs
          node --check server/core/control-guards.mjs
          npm run build
          npm test
      - name: Verify V1 dependency is absent
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          if (lock.packages?.['node_modules/@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in lockfile');
          if (lock.packages?.['node_modules/@opencode/client']?.version !== '2.0.24') throw new Error('pinned @opencode/client@2.0.24 missing from lockfile');
          NODE
