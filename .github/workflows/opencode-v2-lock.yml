name: OpenCode V2 validation helper

on:
  push:
    branches:
      - feat/opencode-v2-migration
    paths:
      - package.json
      - .github/workflows/opencode-v2-lock.yml

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/opencode-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Finish generated V2 compatibility cleanup
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          {
            const path = 'server/core/project-readiness.mjs';
            let text = await readFile(path, 'utf8');
            text = text.replace('not available from a OpenCode V2 model catalog', 'not available from the OpenCode V2 model catalog');
            text = text.replace('No connected OpenCode global default model could be identified.', 'No available OpenCode V2 global default model could be identified.');
            await writeFile(path, text);
          }

          {
            const path = 'server/integrations/opencode.mjs';
            let text = await readFile(path, 'utf8');
            const before = `  mcpResources(directory) {\n    return this.call('mcp.resource.catalog', () => this.client.mcp.resource.catalog(\n      v2Location(directory),\n      this.requestOptions(10_000),\n    ));\n  }`;
            const after = `  async mcpResources(directory) {\n    const value = await this.call('mcp.resource.catalog', () => this.client.mcp.resource.catalog(\n      v2Location(directory),\n      this.requestOptions(10_000),\n    ));\n    return value?.data || value || { resources: [], templates: [] };\n  }`;
            if (text.includes(before)) text = text.replace(before, after);
            await writeFile(path, text);
          }

          {
            const path = 'test/project-readiness.test.mjs';
            let text = await readFile(path, 'utf8');
            text = text.replaceAll('@opencode-ai/sdk', '@opencode/client');
            text = text.replace(/(id:\s*'[^']+',\s*)connected:\s*true/g, '$1available: true');
            text = text.replace('connected default', 'available default');
            await writeFile(path, text);
          }
          NODE
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify and test V2 branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check server/integrations/opencode.mjs
          node --check server/orchestrator.mjs
          node --check server/core/opencode-dispatch-safety.mjs
          node --check server/core/runner-session-status.mjs
          node --check server/core/project-readiness.mjs
          npm test
      - name: Verify V1 dependency is absent
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          if (lock.packages?.['node_modules/@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in lockfile');
          if (lock.packages?.['node_modules/@opencode/client']?.version !== '2.0.24') throw new Error('pinned @opencode/client@2.0.24 missing from lockfile');
          NODE
      - name: Commit cleanup generated by validation helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json server/core/project-readiness.mjs server/integrations/opencode.mjs test/project-readiness.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(opencode): finish V2 compatibility cleanup'
          git push origin HEAD:feat/opencode-v2-migration
