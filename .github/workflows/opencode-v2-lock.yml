name: OpenCode V2 exact-head validation

on:
  push:
    branches:
      - feat/opencode-v2-migration

permissions:
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prove exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
      - name: Verify completed migration has no transition tooling
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/finalize-opencode-v2.mjs
          test ! -e scripts/migrate-control-guards-v2.mjs
          test ! -e scripts/migrate-opencode-v2-orchestrator.mjs
          test ! -e .github/workflows/opencode-v2-migrate.yml
      - name: Verify legacy OpenCode runtime/test paths are absent
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const roots = ['server', 'scripts', 'test'];
          const excluded = new Set(['test/opencode-v2-contract.test.mjs']);
          const forbidden = [
            '@opencode-ai/sdk', 'createOpencodeClient', 'promptAsync', 'prompt_async',
            'findSessionByTitle', 'inspectSessionStatusRecord', '.sessionStatus(',
            '.app.agents(', '.tool.ids(', '.lsp.status(', '.formatter.status(',
          ];
          const offenders = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name).replaceAll('\\', '/');
              if (entry.isDirectory()) await walk(path);
              else if (entry.isFile() && /\.(?:mjs|js)$/.test(entry.name) && !excluded.has(path)) {
                const text = await readFile(path, 'utf8');
                for (const token of forbidden) if (text.includes(token)) offenders.push(`${path}: ${token}`);
              }
            }
          }
          for (const root of roots) await walk(root);
          if (offenders.length) throw new Error(`Legacy OpenCode V1 paths remain:\n${offenders.join('\n')}`);
          NODE
      - name: Verify lockfile is stable
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp /tmp/package-lock.before package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find server test scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Verify exact V2 dependency
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          if (pkg.dependencies?.['@opencode/client'] !== '2.0.24') throw new Error('package.json must pin @opencode/client@2.0.24');
          if (pkg.dependencies?.['@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in package.json');
          if (lock.packages?.['node_modules/@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in lockfile');
          if (lock.packages?.['node_modules/@opencode/client']?.version !== '2.0.24') throw new Error('pinned @opencode/client@2.0.24 missing from lockfile');
          NODE
