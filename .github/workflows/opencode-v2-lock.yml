name: OpenCode V2 validation helper

on:
  push:
    branches:
      - feat/opencode-v2-migration

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/opencode-v2-migration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Migrate remaining V2 test fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/migrate-opencode-v2-test-fixtures.mjs ]; then
            node scripts/migrate-opencode-v2-test-fixtures.mjs
            rm scripts/migrate-opencode-v2-test-fixtures.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add test scripts/migrate-opencode-v2-test-fixtures.mjs
            git commit -m 'test(opencode): finish V2 fixture migration'
            git push origin HEAD:feat/opencode-v2-migration
          fi
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile drift before validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(opencode): refresh V2 lockfile'
          git push origin HEAD:feat/opencode-v2-migration
      - name: Verify and test V2 branch
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check server/integrations/opencode.mjs
          node --check server/orchestrator.mjs
          node --check server/core/opencode-dispatch-safety.mjs
          node --check server/core/runner-session-status.mjs
          node --check server/core/project-readiness.mjs
          node --check server/core/control-guards.mjs
          npm test
      - name: Verify V1 dependency is absent
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          if (lock.packages?.['node_modules/@opencode-ai/sdk']) throw new Error('legacy @opencode-ai/sdk remains in lockfile');
          if (lock.packages?.['node_modules/@opencode/client']?.version !== '2.0.24') throw new Error('pinned @opencode/client@2.0.24 missing from lockfile');
          NODE
